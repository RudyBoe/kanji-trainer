<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)">
<title>Kanji Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="back" aria-label="Back" disabled>←</button>
  <button id="missed" aria-label="Go to a missed word">✗ <span id="missed-n">0</span></button>
  <button id="random" aria-label="Random word">⤮</button>
  <button id="menu-btn" aria-label="Settings">⋯</button>
</header>

<main id="card">
  <p id="via"></p>
  <div id="word" lang="ja"></div>
  <div id="answer" hidden>
    <p id="reading" lang="ja"></p>
    <ol id="meanings"></ol>
  </div>
</main>

<footer>
  <button id="reveal" class="primary">Show</button>
  <div id="after" hidden>
    <button id="mark" aria-pressed="false">✗ Missed</button>
    <p class="hint">Tap a kanji to continue<br><small>+n same reading · ~n other reading · – dead end</small></p>
  </div>
</footer>

<dialog id="menu">
  <form method="dialog">
    <h2>Settings</h2>
    <label><input type="checkbox" id="opt-readings"> Show readings before reveal</label>
    <p id="stats"></p>
    <button type="button" id="reset" class="danger">Reset progress</button>
    <p class="credits">Word data: <a href="https://www.edrdg.org/edrdg/licence.html">JMdict &amp; KANJIDIC2</a> (EDRDG, CC-BY-SA 4.0), JLPT levels from Jonathan Waller's lists (CC-BY). <a href="https://github.com/RudyBoe/kanji-trainer">Source</a></p>
    <button value="close" class="primary">Close</button>
  </form>
</dialog>

<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
